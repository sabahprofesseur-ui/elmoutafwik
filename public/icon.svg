<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="50%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" stroke="white" stroke-width="8" stroke-dasharray="16 12" stroke-opacity="0.4" />

  <!-- Inner Circle with Glow -->
  <circle cx="256" cy="256" r="185" fill="#FFF8E1" filter="url(#glow)" />

  <!-- Fennec Mascot & Book Illustration -->
  <g transform="translate(256, 230)">
    <!-- Fennec Ears -->
    <path d="M-80 -40 L-130 -140 L-40 -60 Z" fill="#FF8A00" stroke="#E65100" stroke-width="6" stroke-linejoin="round" />
    <path d="M-75 -50 L-115 -125 L-50 -65 Z" fill="#FFE082" />
    <path d="M80 -40 L130 -140 L40 -60 Z" fill="#FF8A00" stroke="#E65100" stroke-width="6" stroke-linejoin="round" />
    <path d="M75 -50 L115 -125 L50 -65 Z" fill="#FFE082" />

    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="90" ry="75" fill="#FF8A00" stroke="#E65100" stroke-width="6" />

    <!-- Face White Mask -->
    <path d="M-60 10 C-40 35 0 45 60 10 C35 -5 -35 -5 -60 10 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Eyes (Friendly cartoon eyes) -->
    <circle cx="-35" cy="-30" r="14" fill="#212121" />
    <circle cx="-30" cy="-35" r="5" fill="#FFFFFF" />
    <circle cx="35" cy="-30" r="14" fill="#212121" />
    <circle cx="40" cy="-35" r="5" fill="#FFFFFF" />

    <!-- Cute Nose & Smile -->
    <ellipse cx="0" cy="-10" rx="10" ry="7" fill="#212121" />
    <path d="M-14 5 Q0 18 14 5" fill="none" stroke="#212121" stroke-width="5" stroke-linecap="round" />

    <!-- Graduation Cap on Fennec Head -->
    <polygon points="0,-125 75,-95 0,-65 -75,-95" fill="#1A237E" stroke="#0D47A1" stroke-width="4" />
    <polygon points="0,-65 45,-80 45,-60 0,-45 -45,-60 -45,-80" fill="#283593" />
    <circle cx="0" cy="-95" r="5" fill="#FFD54F" />
    <path d="M0 -95 Q40 -90 65 -65" fill="none" stroke="#FFD54F" stroke-width="5" stroke-linecap="round" />

    <!-- Open Book in Front -->
    <path d="M-110 50 Q-55 40 0 65 Q55 40 110 50 L95 110 Q50 95 0 115 Q-50 95 -95 110 Z" fill="#FFFFFF" stroke="#FF6F00" stroke-width="6" />
    <path d="M0 65 L0 115" stroke="#FF6F00" stroke-width="5" />
    <!-- Book lines -->
    <line x1="-80" y1="70" x2="-20" y2="76" stroke="#B0BEC5" stroke-width="4" stroke-linecap="round" />
    <line x1="-75" y1="85" x2="-20" y2="91" stroke="#B0BEC5" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="76" x2="80" y2="70" stroke="#B0BEC5" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="91" x2="75" y2="85" stroke="#B0BEC5" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Golden Ribbon Banner at bottom -->
  <g transform="translate(256, 420)">
    <rect x="-160" y="-35" width="320" height="60" rx="30" fill="url(#gold-grad)" stroke="#FFA000" stroke-width="4" filter="url(#glow)" />
    <!-- Stars -->
    <text x="-125" y="4" font-size="24">⭐</text>
    <text x="105" y="4" font-size="24">⭐</text>
    <text x="0" y="8" font-family="'Cairo', sans-serif" font-weight="900" font-size="26" fill="#3E2723" text-anchor="middle">المتفوق الصغير</text>
  </g>
</svg>
